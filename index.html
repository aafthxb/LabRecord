  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Prism.js Dark Theme for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  
  <script>
(() => {
    const theme = localStorage.getItem("theme");

    if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
    }

    const meta = document.querySelector('meta[name="theme-color"]');

    if (meta) {
        meta.setAttribute(
            "content",
            theme === "dark"
                ? "#161616"
                : "#F4EBCF"
        );
    }
})();
</script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="editor.css" />

</head>
<body>

  <div class="app-container">
    <div class="brutalist-wrapper">
      <header class="app-header">
        <div class="header-bar">

    <div>
        <h1 class="app-title" id="page-title">LABRECORD</h1>
        <p class="app-subtitle" id="page-subtitle">
    Interactive Programming Lab Record
    <br>
    Browse, search, and run programs by language
</p>
    </div>

    <div class="header-actions-right">

        <button
    id="editor-btn"
    class="theme-btn"
    type="button"
    title="Editor access"
    aria-label="Toggle editor access">
    <span class="theme-icon theme-icon-editor">✏️</span>
</button>

        <button
    id="theme-btn"
    class="theme-btn"
    title="Toggle theme"
    aria-label="Toggle theme">
    <span class="theme-icon">🌙</span>
</button>

        <a class="back-btn"
                id="add-program-btn"
                style="display:none;"
                title="Add a new program"
                aria-label="Add a new program">
            [ + ]
        </a>

        <button class="back-btn"
                id="back-btn"
                onclick="showHome(event)">
            [ BACK ]
        </button>

    </div>

</div>
      </header>

      <!-- Shown whenever editor mode is unlocked (see body.site-edit-mode in editor.css) -->
      <div id="editor-mode-banner" class="banner banner-success">
        ✏️ Editor Mode is active — add, edit, delete, and reorder programs.
      </div>

      <!-- Home View -->
      <div id="home-view" class="home-grid"></div>

      <!-- Program Containers -->
      <div id="language-views"></div>
      <footer class="app-footer" id="app-footer"></footer>
    </div>
  </div>

  <!-- Editor access gate (site-wide) -->
  <div id="site-gate-overlay" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h2 class="modal-title">Editor Access</h2>
      <p class="modal-text">Enter your access code to reveal editing tools — add, edit, delete, and reorder programs — right here on the site.</p>
      <input id="site-gate-input" type="password" class="editor-input" placeholder="Access code" autocomplete="off" />
      <div id="site-gate-error" class="banner banner-error" style="display:none;"></div>
      <button id="site-gate-submit" class="action-btn run-btn gate-submit-btn">UNLOCK</button>
      <button id="site-gate-cancel" type="button" class="action-btn gate-home-btn">CANCEL</button>
    </div>
  </div>

  <!-- Pending reorder/delete changes -->
  <div id="edit-save-bar" class="edit-save-bar" style="display:none;">
    <span id="edit-save-status" class="edit-save-status"></span>
    <div class="edit-save-actions">
      <button id="edit-discard-btn" type="button" class="action-btn">DISCARD</button>
      <button id="edit-save-btn" type="button" class="action-btn run-btn">SAVE CHANGES</button>
    </div>
  </div>

  <!-- Prism.js Scripts for Syntax Highlighting -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script defer src="generated/prism-loader.js"></script>
<script defer src="script.js"></script>

</body>

</html>
